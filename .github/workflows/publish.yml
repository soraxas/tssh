name: Release and publish patched tssh and tsshd

on:
  release:
    types: [released]

permissions:
  contents: write

jobs:
  release-and-publish:
    name: Release and publish patched tssh and tsshd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v1"
          args: release --clean --skip=publish

      - name: Show Checksum
        run: |
          sha256sum dist/*.tar.gz dist/*.zip dist/*.rpm dist/*.deb dist/*_checksums.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.rpm
            dist/*.deb
            dist/*_checksums.txt

  release-win7-patch:
    name: Build win7 release with go-legacy-win7 patch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up legacy-win7 Go
        run: |
          wget -q https://github.com/thongtech/go-legacy-win7/releases/download/v1.25.7-1/go-legacy-win7-1.25.7-1.linux_amd64.tar.gz -O /tmp/go.tar.gz
          tar -C $HOME -xzf /tmp/go.tar.gz

      - name: Build tssh and tsshd for Windows 7
        run: |
          export GOROOT=$HOME/go-legacy-win7
          export GOPATH=$HOME/go
          export PATH=$GOROOT/bin:$GOPATH/bin:$PATH
          go version
          version=${GITHUB_REF/refs\/tags\/v/}

          for arch in 386 amd64; do
            case $arch in
              386)   suffix=i386 ;;
              amd64) suffix=x86_64 ;;
            esac

            # tssh
            dir="tssh_${version}_win7_${suffix}"
            mkdir -p "$dir"
            GOOS=windows GOARCH=$arch go build -trimpath -ldflags "-s -w" \
              -o "$dir/" ./trzsz-ssh/cmd/tssh
            zip -r "${dir}.zip" "$dir"

            # tsshd
            dir="tsshd_${version}_win7_${suffix}"
            mkdir -p "$dir"
            GOOS=windows GOARCH=$arch go build -trimpath -ldflags "-s -w" \
              -o "$dir/" ./tsshd/cmd/tsshd
            zip -r "${dir}.zip" "$dir"
          done

      - name: Show Checksum
        run: sha256sum ./*.zip

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: ./*.zip
