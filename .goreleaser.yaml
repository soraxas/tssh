project_name: tssh-patched

# Build matrix mirrors upstream trzsz-ssh / tsshd (.goreleaser.yaml).
# tssh targets one extra GOOS (android/arm64) that tsshd does not -- tsshd
# is a server, android doesn't make sense for it.

builds:
  - id: tssh
    main: ./cmd/tssh
    binary: tssh
    dir: ./trzsz-ssh
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - windows
      - darwin
      - android
      - freebsd
    goarch:
      - "386"
      - amd64
      - arm
      - arm64
      - loong64
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: loong64
      - goos: android
        goarch: arm
      - goos: android
        goarch: "386"
      - goos: android
        goarch: amd64
      - goos: android
        goarch: loong64
      - goos: freebsd
        goarch: arm
      - goos: freebsd
        goarch: "386"
      - goos: freebsd
        goarch: loong64
      - goos: windows
        goarch: loong64

  - id: tsshd
    main: ./cmd/tsshd
    binary: tsshd
    dir: ./tsshd
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - windows
      - darwin
      - freebsd
    goarch:
      - "386"
      - amd64
      - arm
      - arm64
      - loong64
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: loong64
      - goos: freebsd
        goarch: arm
      - goos: freebsd
        goarch: "386"
      - goos: freebsd
        goarch: loong64
      - goos: windows
        goarch: loong64

# One archive per OS/arch containing BOTH binaries -- friendlier for tools
# like mise that install both as a single unit. Per-binary .deb/.rpm still
# get produced below via nfpms for users who only want one.
archives:
  - id: combined
    builds:
      - tssh
      - tsshd
    # android/arm64 only has tssh (tsshd isn't built for android), so the
    # binary count per platform varies. Opt out of the consistency check.
    allow_different_binary_count: true
    name_template: >-
      tssh_
      {{- .Version }}_
      {{- if eq .Os "darwin" }}macos_
      {{- else }}{{ .Os }}_{{ end }}
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else if eq .Arch "arm" }}armv{{ .Arm }}
      {{- else }}{{ .Arch }}{{ end }}
    wrap_in_directory: true
    format_overrides:
      - goos: windows
        format: zip
    files:
      - none*

# nfpms automatically filters to Linux builds -- the .rpm/.deb files are
# only produced for linux/{amd64,386,arm,arm64,loong64}.
nfpms:
  - id: tssh
    package_name: tssh
    builds:
      - tssh
    section: net
    file_name_template: >-
      tssh_
      {{- .Version }}_
      {{- if eq .Os "darwin" }}macos_
      {{- else }}{{ .Os }}_{{ end }}
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else if eq .Arch "arm" }}armv{{ .Arm }}
      {{- else }}{{ .Arch }}{{ end }}
    homepage: https://github.com/soraxas/tssh
    maintainer: Tin Lai <tin@tinyiu.com>
    description: |
      tssh -- patched fork of trzsz-ssh with STUN-based UDP hole punching.
    license: MIT
    formats:
      - rpm
      - deb
    bindir: /usr/bin
    rpm:
      group: Unspecified

  - id: tsshd
    package_name: tsshd
    builds:
      - tsshd
    section: net
    file_name_template: >-
      tsshd_
      {{- .Version }}_
      {{- if eq .Os "darwin" }}macos_
      {{- else }}{{ .Os }}_{{ end }}
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else if eq .Arch "arm" }}armv{{ .Arm }}
      {{- else }}{{ .Arch }}{{ end }}
    homepage: https://github.com/soraxas/tssh
    maintainer: Tin Lai <tin@tinyiu.com>
    description: |
      tsshd -- patched UDP-based SSH server with PTY-fd leak fix and STUN
      hole-punching support.
    license: MIT
    formats:
      - rpm
      - deb
    bindir: /usr/bin
    rpm:
      group: Unspecified

snapshot:
  name_template: "{{ .Version }}.next"

checksum:
  name_template: "tssh-patched_{{ .Version }}_checksums.txt"

release:
  draft: false
  prerelease: auto
  name_template: "{{ .ProjectName }} v{{ .Version }}"
